<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>쿠폰 확인 · 브로우원 직원용</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=822146ff">
  <style>
    .v { max-width: 460px; margin: 0 auto; padding: 48px 24px; }
    .v input { width: 100%; min-height: 56px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; font: 700 22px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
    .v input:focus-visible { outline: 2px solid var(--cocoa); outline-offset: 2px; }
    .out { margin-top: 16px; padding: 20px; border-radius: var(--r-l); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); min-height: 88px; }
    .out b { font-family: var(--f-kr); font-size: 20px; }
    .ok b { color: #3c6b3f; } .bad b { color: #a3343f; }
  </style>
</head>
<body>
  <main class="v">
    <p class="eyebrow">Brow Lab · 직원용</p>
    <h1 class="h2" style="margin-top:8px">할인권 코드 확인</h1>
    <p class="small">손님 화면의 BW-XXXX-XXXX 코드를 입력하면 브로우원 쿠폰인지, 언제 발급됐는지 보여줘요. 서버가 없어서 사용 여부는 기록되지 않으니, 사용한 코드는 예약 메모에 남겨 주세요.</p>
    <label class="sr" for="code">쿠폰 코드</label>
    <input id="code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="BW-XXXX-XXXX" style="margin-top:24px">
    <div class="out" id="out" aria-live="polite"><span class="small">코드를 입력해 주세요</span></div>
  </main>
  <script src="js/config.js?v=da81f40d"></script>
  <script src="js/coupon.js?v=5509e3c5"></script>
  <script>
    const ymd = d => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    const out = document.getElementById('out');
    document.getElementById('code').addEventListener('input', e => {
      const v = e.target.value.trim();
      if (v.replace(/[^0-9A-Za-z]/g, '').length < 10) { out.className = 'out'; out.innerHTML = '<span class="small">코드를 입력해 주세요</span>'; return; }
      const r = BrowCoupon.verify(v);
      if (!r.ok) { out.className = 'out bad'; out.innerHTML = `<b>확인 안 됨</b><p class="small">${r.reason}</p>`; return; }
      out.className = 'out ' + (r.expired ? 'bad' : 'ok');
      out.innerHTML = `<b>${r.expired ? '기한이 지난 쿠폰이에요' : '사용 가능한 1만원 할인권이에요'}</b><p class="small">발급 ${ymd(r.issued)} · 사용기한 ${ymd(r.expires)}까지</p>`;
    });
  </script>
</body>
</html>
